<!DOCTYPE html>
<html>
<head>
  <title>OSM Marker</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
</head>
<body>
  <div class="container">
    <header>
      🗺️ OSM Map Viewer
    </header>

    <div class="sidebar">
      <div class="info-row">
        <label for="infoBox">Мэдээлэл:</label>
        <textarea id="infoBox" rows="6" placeholder="Header + Left side + Map layout..."></textarea>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <!-- Flask-аас дамжуулсан өгөгдлийг JS-д оруулах -->
  <script>
    window.roadsData = {{ roads|tojson }};
    window.buildingsData = {{ buildings|tojson }};
    window.bounds = {{ bounds|tojson }};
  </script>

  <!-- Тусад нь бичсэн JS кодыг оруулна -->
  <script src="{{ url_for('static', filename='map.js') }}"></script>
  <script>
    showLayoutMap(); // layout-д зориулсан функц
  </script>
</body>
</html>
