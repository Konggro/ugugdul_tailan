<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GADM - Монгол Улсын Засаг Захиргааны Хил</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/gadm.css">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Монгол Улсын Засаг Захиргааны Хил</h2>
      <div class="controls">
        <label for="layerSelect">Давхарга:</label>
        <select id="layerSelect">
          <option value="none">---</option>
          <option value="aimags">Аймгийн хил</option>
          <option value="sums">Аймаг + Сум</option>
        </select>
        
        <label for="searchSelect">Хайх:</label>
        <select id="searchSelect">
          <option value="">--- Сум сонгох ---</option>
        </select>
      </div>
      <div id="info-panel">
        <p>Давхарга сонгоно уу.</p>
      </div>
    </div>
    <div class="content">
      <div id="map"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/gadm.js"></script>
</body>
</html>
