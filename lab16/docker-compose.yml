version: '3.8'

services:
  pgrouting-api:
    build: .
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://gisuser:gispass@postgis:5432/gisdb
      - PORT=5002
    volumes:
      - .:/app
    networks:
      - default
      - lab10_default
    depends_on:
      - postgis

  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis_gis
    environment:
      - POSTGRES_DB=gisdb
      - POSTGRES_USER=gisuser
      - POSTGRES_PASSWORD=gispass
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - lab10_default

networks:
  lab10_default:
    external: true


